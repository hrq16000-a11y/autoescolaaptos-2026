name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        command: [build, 'build:standalone']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/check-triagem-safety.mjs
      - run: node scripts/test-safe-next.mjs
      - run: node --experimental-strip-types --test tests/admin-marketing-optins.test.mjs
      - run: node --experimental-strip-types --test tests/marketing-optin-roundtrip.test.mjs
      - run: node --experimental-strip-types --test tests/google-optin-sheets.test.mjs
      - run: node --test tests/apps-script-optins.test.mjs
      - run: node --test tests/offers-original-sheets-flow.test.mjs
      - run: node --test tests/ofertas-atribuicao.test.mjs
      - run: node --experimental-strip-types --test tests/marketing-vercel-export.test.mjs
      - run: node --test tests/inclusao-moto.test.mjs
      - run: npm run ${{ matrix.command }}
      # Simula o build que o editor Lovable usa para a prévia; não publica.
      - run: npm run build:dev
        if: matrix.command == 'build'
      - name: Smoke Vite development server (local preview)
        if: matrix.command == 'build'
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/aptos-vite-dev.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 -o /tmp/aptos-preview.html http://127.0.0.1:8080/; then
              grep -Eq '<div id="root"' /tmp/aptos-preview.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/aptos-vite-dev.log
          exit 1

